[project]
name = "mtp-gaps"
version = "0.1.0"
description = "AM215 mini-project: how fast do Kalshi-Polymarket price gaps close, and how big must they get first?"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alex Meylikhov" },
    { name = "Ravi Tripathi" },
    { name = "Ved Pant" },
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtp_gaps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
